name: Auditor qualification
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  engine:
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.19.0
      - run: npm ci --ignore-scripts
      - run: node scripts/verify-vendor.mjs
      - run: node scripts/cargo.mjs fmt --all -- --check
      - run: node scripts/cargo.mjs clippy --workspace --all-targets -- -D warnings
      - run: node scripts/cargo.mjs test --workspace
      - run: npm run format:check
      - run: node scripts/cargo.mjs build --release --locked -p octri-auditor-cli
      - run: npm run build:node && npm run test:node
      - run: node scripts/contract-test.mjs
      - run: node scripts/performance.mjs
      - run: npm audit --audit-level=low
  browser:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.19.0
      - run: npm ci --ignore-scripts
      - run: node scripts/cargo.mjs build --release -p octri-auditor-cli
      - run: cargo install wasm-bindgen-cli --version 0.2.129 --locked
      - run: npm run build:wasm
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:browser
      - run: node scripts/package-web.mjs
  native:
    strategy:
      matrix:
        platform: [linux/amd64, linux/arm64]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130
      - run: docker build --platform '${{ matrix.platform }}' -f Dockerfile.bindings .
