[package]
name = "octri-auditor-node"
description = "Node-API worker transport for Octri Spec Auditor"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
octri-auditor.workspace = true
napi = { version = "3.14", default-features = false, features = ["napi8"] }
napi-derive = "3.5"

[build-dependencies]
napi-build = "2.3"
