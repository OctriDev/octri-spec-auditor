[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "octri-spec-auditor"
version = "0.1.3"
description = "Python bindings for the offline Octri Rust Spec Auditor"
readme = "README.md"
license = { text = "Apache-2.0" }
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
]
requires-python = ">=3.8"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
octri_auditor = ["native/*"]

[project.urls]
Repository = "https://github.com/octridev/octri-spec-auditor"
Issues = "https://github.com/octridev/octri-spec-auditor/issues"
